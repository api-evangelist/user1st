aid: user1st
name: User1st
description: >-
  User1st is a web and mobile digital accessibility company whose U1 Suite gives
  organizations an efficient path to WCAG, ADA, and European Accessibility Act
  (EAA) compliance. It provides accessibility toolkits and remediation across web
  frameworks (JavaScript/TypeScript, React, Angular, Vue, WordPress, Shopify) and
  mobile platforms (iOS Native, Android Native, React Native, Flutter), plus a
  free accessibility scanner and GenAI-assisted code-fixing and image-description
  tooling. Trusted by organizations including Amtrak, Fannie Mae, IKEA, iRobot,
  T-Mobile, Santander, Mount Sinai, and the City of New York. Backed by 500
  Global. This profile was enriched by the API Evangelist pipeline; the product
  backend is an internal SaaS API with no public developer API surface.
